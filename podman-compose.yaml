# podman-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: routing_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d routing_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app-backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    environment: &backend-env
      DATABASE_URL: postgres://dev:devpassword@postgres:5432/routing_db
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
      # Só o worker classifica: a chave da API NÃO está aqui (a API não precisa dela).
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.containers.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-5}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.5}
    ports:
      - "3000:3000"
    # A API só fica saudável depois de aplicar as migrações e abrir a porta; o worker espera por isso.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Containerfile
    command: ["node", "dist/entrypoints/worker.js"]
    environment:
      <<: *backend-env
      # Segredo só por ambiente (arquivo .env na raiz, ignorado pelo git); nunca em arquivo versionado.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-backend:
        condition: service_healthy

volumes:
  pgdata:
